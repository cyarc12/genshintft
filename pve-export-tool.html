<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVE关卡数据导出工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;color:#ffd700;margin-bottom:8px;font-size:24px}
.subtitle{text-align:center;color:#888;margin-bottom:24px;font-size:13px}
.card{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{color:#e94560;font-size:16px;margin-bottom:12px}
.status-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.status-dot.ok{background:#4caf50}
.status-dot.missing{background:#f44336}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.stage-tag{background:#0f3460;border:1px solid #1a508b;border-radius:6px;padding:6px 10px;text-align:center;font-size:12px;font-family:monospace}
.stage-tag.has-data{background:#1a3a1a;border-color:#2e7d32;color:#4caf50}
.stage-tag.no-data{background:#3a1a1a;border-color:#c62828;color:#f44336}
.stage-tag .count{font-size:10px;color:#888}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#ff6b81}
.btn-secondary{background:#0f3460;color:#e0e0e0}
.btn-secondary:hover{background:#1a508b}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.preview-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:16px;margin-top:12px;max-height:400px;overflow:auto;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
.report-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.report-table th{background:#0f3460;text-align:left;padding:8px 10px;font-weight:600}
.report-table td{padding:6px 10px;border-bottom:1px solid #0f3460}
.report-table tr:hover{background:rgba(233,69,96,.05)}
.msg{text-align:center;padding:12px;border-radius:8px;margin:12px 0;font-size:14px}
.msg.success{background:#1a3a1a;border:1px solid #2e7d32;color:#4caf50}
.msg.warn{background:#3a2a1a;border:1px solid #e65100;color:#ff9800}
.msg.error{background:#3a1a1a;border:1px solid #c62828;color:#f44336}
</style>
</head>
<body>
<div class="container">
<h1>PVE 关卡数据导出工具</h1>
<p class="subtitle">从浏览器 localStorage 导出 20 个预设关卡数据，保存为项目文件</p>

<div class="card">
  <h2>1. 检测 localStorage 数据</h2>
  <p><span class="status-dot" id="dot-current"></span> <span id="status-current">检测中...</span></p>
  <div class="stage-grid" id="stage-grid"></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="detect()">重新检测</button>
  </div>
</div>

<div class="card" id="browser-only-section" style="display:none">
  <h2>2. 预览与导出</h2>
  <div id="stats-row"></div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-download" onclick="downloadJSON()">下载 default-pve-stages.json</button>
    <button class="btn btn-secondary" onclick="togglePreview()">预览完整数据</button>
  </div>
  <div class="preview-box" id="preview-box" style="display:none"></div>
  <div id="msg-area"></div>
</div>

<div class="card">
  <h2>使用说明</h2>
  <ol style="padding-left:16px;line-height:1.8;font-size:13px;color:#aaa">
    <li>用<b>你平时玩游戏的浏览器</b>打开此页面</li>
    <li>点击<b>"下载 default-pve-stages.json"</b>按钮</li>
    <li>将下载的 JSON 文件放到项目根目录（覆盖同名文件）</li>
    <li>运行 <code style="background:#0f3460;padding:1px 6px;border-radius:3px">git add . &amp;&amp; git commit -m "导出20关数据" &amp;&amp; git push</code></li>
  </ol>
</div>
</div>

<script>
var ORDER=['1-1','1-2','1-3','1-4','1-5','1-6','2-1','2-2','2-3','2-4','2-5','2-6','3-1','3-2','3-3','3-4','3-5','3-6','EX-1','EX-2'];
var SLOT_KEY='element-auto-chess-pve-stage-slots-v2';
var DEFAULT_SLOT_KEY='element-auto-chess-pve-default-stages-v1';

function detect(){
  var grid=document.getElementById('stage-grid');
  var dot=document.getElementById('dot-current');
  var st=document.getElementById('status-current');
  var browserSection=document.getElementById('browser-only-section');
  var statsRow=document.getElementById('stats-row');
  var msgArea=document.getElementById('msg-area');

  var currentData=null;
  try{currentData=JSON.parse(localStorage.getItem(SLOT_KEY)||'null')}catch(e){}

  var hasData=false,totalEnemies=0;
  grid.innerHTML='';

  ORDER.forEach(function(id){
    var arr=currentData&&currentData[id];
    var count=Array.isArray(arr)?arr.length:0;
    totalEnemies+=count;
    if(count>0)hasData=true;
    var tag=document.createElement('div');
    tag.className='stage-tag'+(count>0?' has-data':' no-data');
    tag.innerHTML=id+'<br><span class="count">'+(count>0?count+' 敌人':'无数据')+'</span>';
    grid.appendChild(tag);
  });

  var foundCount=ORDER.filter(function(id){return Array.isArray(currentData&&currentData[id])&&currentData[id].length>0;}).length;

  if(hasData){
    dot.className='status-dot ok';
    st.textContent='已找到 '+foundCount+' 个有数据的关卡，共 '+totalEnemies+' 个敌人';
  }else{
    dot.className='status-dot missing';
    st.textContent='localStorage 中没有关卡数据。如果之前玩过挑战模式，请确保用同一个浏览器打开此页面。';
  }

  if(hasData){
    var equippedCount=ORDER.reduce(function(sum,id){
      var arr=currentData[id]||[];
      return sum+arr.filter(function(e){return Array.isArray(e.equipmentIds)&&e.equipmentIds.length>0;}).length;
    },0);
    var defaultData=null;
    try{defaultData=JSON.parse(localStorage.getItem(DEFAULT_SLOT_KEY)||'null')}catch(e){}
    statsRow.innerHTML='<table class="report-table">'+
      '<tr><th>项目</th><th>值</th></tr>'+
      '<tr><td>有数据的关卡数</td><td>'+foundCount+' / 20</td></tr>'+
      '<tr><td>敌方棋子总数</td><td>'+totalEnemies+'</td></tr>'+
      '<tr><td>已装备棋子数</td><td>'+equippedCount+'</td></tr>'+
      '<tr><td>storage key</td><td><code>'+SLOT_KEY+'</code></td></tr>'+
      '<tr><td>默认备份 key</td><td><code>'+DEFAULT_SLOT_KEY+'</code> '+(defaultData?'(已存在)':'(无)')+'</td></tr>'+
      '</table>';
  }

  browserSection.style.display=hasData?'block':'none';
  msgArea.innerHTML='';
  window._exportData=currentData;
  window._hasData=hasData;
}

function downloadJSON(){
  if(!window._hasData||!window._exportData){
    document.getElementById('msg-area').innerHTML='<div class="msg error">没有可导出的数据</div>';
    return;
  }
  var output={};
  ORDER.forEach(function(id){output[id]=window._exportData[id]||[];});
  var json=JSON.stringify(output,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='default-pve-stages.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('msg-area').innerHTML='<div class="msg success">已下载 default-pve-stages.json，请将其放到项目根目录（覆盖原文件）</div>';
}

function togglePreview(){
  var box=document.getElementById('preview-box');
  if(box.style.display==='none'){
    if(!window._exportData)return;
    var preview={};
    ORDER.forEach(function(id){preview[id]=window._exportData[id]||[];});
    box.textContent=JSON.stringify(preview,null,2);
    box.style.display='block';
  }else{
    box.style.display='none';
  }
}

detect();
</script>
</body>
</html>
