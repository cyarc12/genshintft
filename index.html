.warehouse-panel{position:absolute;top:185px;right:26px;left:auto;bottom:auto;width:298px;max-height:520px;z-index:40;margin:0;transform:none;translate:none;display:flex;flex-direction:column;overflow:hidden;background:#0f1928f2;border:1px solid #314566;border-radius:12px;box-shadow:0 12px 35px #0008}

.wh-section-label{color:#7f96b5;font-size:10px;padding:5px 10px 3px;display:block}

function endDrag(e){

  if(pendingWhDrag&&!dragUnit){pendingWhDrag=null;pointerDownUnit=null;return}
  if(pendingUnitDrag&&!dragUnit){pendingUnitDrag=null;pointerDownUnit=null;return}

  clearUnitDragState();
}

function skillTextForStar(text,star){
  if(!text)return text;
  const index=Math.max(0,Math.min(2,(Number(star)||1)-1));
  const unitPattern='(?:%|点|秒|格|次|层|生命|攻击力)?';
  let result=String(text).replace(
    new RegExp('1\\/2星\\s*([+-]?\\d+(?:\\.\\d+)?)('+unitPattern+')\\s*[，,]?\\s*3星\\s*([+-]?\\d+(?:\\.\\d+)?)('+unitPattern+')','g'),
    (_,low,lowUnit,high,highUnit)=>index<2?low+lowUnit:high+highUnit
  );
  result=result.replace(
    new RegExp('([+-]?\\d+(?:\\.\\d+)?)('+unitPattern+')\\s*\\/\\s*([+-]?\\d+(?:\\.\\d+)?)('+unitPattern+')\\s*\\/\\s*([+-]?\\d+(?:\\.\\d+)?)('+unitPattern+')','g'),
    (_,a,au,b,bu,c,cu)=>{const values=[a,b,c],units=[au,bu,cu];return values[index]+(units[index]||units.find(Boolean)||'')}
  );
  return result;
}
